<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="130" height="114" fill="none">
  <!-- Soft Oval Shadow -->
  <ellipse cx="80" cy="128" rx="46" ry="5.5" fill="#ff3b3b" opacity="0.14" />

  <!-- Floating Sparkles / Accents -->
  <!-- Top Center Dot -->
  <circle cx="72" cy="33" r="2.5" fill="#ff3838" />
  <!-- Top Right Cross -->
  <path d="M125 31v10M120 36h10" stroke="#ff3838" stroke-width="2.5" stroke-linecap="round" />
  <!-- Left Middle Cross -->
  <path d="M38 57v10M33 62h10" stroke="#ff3838" stroke-width="2.5" stroke-linecap="round" />
  <!-- Lower Left Cross -->
  <path d="M26 89v10M21 94h10" stroke="#ff3838" stroke-width="2.5" stroke-linecap="round" />
  <!-- Right Middle Dot -->
  <circle cx="134" cy="87" r="3.2" fill="#ff3838" />
  <!-- Bottom Right Dot -->
  <circle cx="120" cy="115" r="2.2" fill="#ff3838" />

  <!-- Trash Can Body (Tapered with Rounded Bottom) -->
  <path d="M52 66 h56 l-6.5 45 c-0.6 4.2-4.2 7.4-8.5 7.4 h-26 c-4.3 0-7.9-3.2-8.5-7.4 Z" fill="#ff3838" />
  
  <!-- 3 White Cutout Vertical Slats with Rounded Ends -->
  <line x1="66" y1="76" x2="68" y2="106" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" />
  <line x1="80" y1="76" x2="80" y2="106" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" />
  <line x1="94" y1="76" x2="92" y2="106" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" />

  <!-- Tilted Open Lid (Tilted up towards right) -->
  <g transform="rotate(-12, 48, 62)">
    <!-- Lid Handle: open rounded arch -->
    <path d="M72 52 v-5 c0-2.5 2-4.5 4.5-4.5 h7 c2.5 0 4.5 2 4.5 4.5 v5" stroke="#ff3838" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- Lid Base: rounded bar -->
    <rect x="46" y="52" width="68" height="12" rx="6" fill="#ff3838" />
  </g>
</svg>
