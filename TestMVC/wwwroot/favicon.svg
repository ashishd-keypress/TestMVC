<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Squircle App Badge -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16.5" fill="url(#primaryGrad)"/>
  
  <!-- 3D Layer Stack Icon (High contrast, razor-sharp) -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Layer (Solid surface plate) -->
    <polygon points="32 14, 13 23, 32 31, 51 23" fill="#ffffff" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Middle Layer -->
    <polyline points="13 36, 32 44, 51 36" stroke-width="5.2"/>
    <!-- Bottom Layer -->
    <polyline points="13 47, 32 55, 51 47" stroke-width="5.2"/>
  </g>
</svg>